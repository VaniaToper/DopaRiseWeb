<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DopaRise</title>
  <meta name="description" content="DopaRise — track habits, build streaks, and rise every day." />
  <style>
    :root {
      color-scheme: light;
      --text: #f5f7fa;
      --muted: rgba(245, 247, 250, 0.65);
      --accent: #5a8fd4;
      --accent-2: #6b4fc8;
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 80% -10%, rgba(59, 110, 168, 0.28), transparent 45%),
        linear-gradient(160deg, #0b0f14, #0d1220 45%, #0b0f1e);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    main {
      width: min(100%, 28rem);
      padding: 2rem 1.75rem;
      border-radius: 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0;
      line-height: 1.55;
      color: var(--muted);
    }
    footer {
      margin-top: 1.5rem;
    }
    footer a {
      color: var(--accent);
      font-size: 0.9rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>DopaRise</h1>
    <p>Track habits. Build streaks. Rise every day.</p>
    <footer>
      <a href="/privacy-policy">Privacy Policy</a>
      ·
      <a href="mailto:hello@doparise.com">hello@doparise.com</a>
    </footer>
  </main>
</body>
</html>
